name: Build PZChessBot Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Build PZChessBot (ARM64)
        run: |
          make arm \
            CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
            OPTFLAGS="-O3 -flto=auto -march=armv8-a" \
            BASEFLAGS="-std=c++20 -DNNUE_PATH=\\\"nnue.bin\\\" -DVERSION=\\\"v-android\\\" -static-libstdc++" \
            EXE=pzchessbot

      - name: Verify output
        run: |
          ls -la pzchessbot

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pzchessbot-android-arm64
          path: pzchessbot

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: PZChessBot Android Build ${{ github.run_number }}
          prerelease: true
          files: pzchessbot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
