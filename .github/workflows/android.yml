name: Build PZChessBot Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Download NNUE network
        run: |
          curl -sL https://github.com/kevlu8/PZChessBot-Networks/releases/latest/download/nnue.bin -o nnue.bin || \
          curl -sL https://github.com/kevlu8/PZChessBot-Networks/raw/main/nnue.bin -o nnue.bin

      - name: Patch Android Source Compatibility
        run: |
          # Fix missing sstream in search.cpp if needed
          sed -i '1i #include <sstream>' engine/search.cpp

          # Comment out non-portable glibc pthread call not present in Android Bionic
          sed -i 's/pthread_setattr_default_np/\/\/ pthread_setattr_default_np/g' engine/threads.cpp

      - name: Build PZChessBot (ARM64)
        run: |
          make pzchessbot \
            CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
            OPTFLAGS="-O3 -flto=auto -march=armv8-a" \
            BASEFLAGS="-std=c++20 -DNNUE_PATH=\\\"nnue.bin\\\" -DVERSION=\\\"v-android\\\"" \
            LDFLAGS="-static-libstdc++"

      - name: Verify Output
        run: |
          ls -la pzchessbot
          file pzchessbot

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pzchessbot-android-arm64
          path: pzchessbot

      - name: Create Prerelease
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: PZChessBot Android Build ${{ github.run_number }}
          prerelease: true
          files: pzchessbot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
